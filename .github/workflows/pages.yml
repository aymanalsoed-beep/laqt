# يبني قاعدة «لقط» من data/ ثم الموقع ولوحة الإدخال، وينشرها على GitHub Pages عند كل دفع إلى main.
# ولوحة الإدخال (admin/) تحفظ في data/entries/ على main، فكل حفظ منها يشغّل هذا النشر.
name: نشر الموقع

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: بناء القاعدة من data/
        run: python3 scripts/build_db.py
      - name: بناء الموقع
        run: python3 scripts/build_site.py --out _site
      - name: بناء لوحة الإدخال
        run: python3 scripts/build_admin.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
